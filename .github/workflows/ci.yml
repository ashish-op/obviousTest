name: CI

# Credential-free by design: this repo's build, lint, and tests must pass with
# zero external services. No secrets are configured or required here — the
# adapter factory resolves to deterministic fixtures whenever credentials are
# absent, so CI can never reach Twilio or ConcentrateAI.

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (schema parity, encryption, seed)
        run: npm test

      - name: Build
        run: npm run build
